[package]
name = "scan-core"
version = "0.1.0"
description = "Scans pages from the HP LaserJet Pro MFP M130a over USB (eSCL) into a PDF"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# ScriptedTransport and fixture loading, for other crates' tests.
testing = []

[dependencies]
httparse = "=1.10.1"
nusb = "=0.2.9"
pdf-writer = "=0.15.0"
quick-xml = "=0.42.0"
thiserror = "=2.0.21"

[dev-dependencies]
lopdf = { version = "=0.47.0", default-features = false }

[lints]
workspace = true
